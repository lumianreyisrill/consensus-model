# Consensus — Multi-Model AI Debate Engine
# Place this file at ~/.config/consensus/config.toml

temperature = 0.3
max_tokens = 4096
timeout_secs = 120
max_retries = 2
history_db_path = "~/.config/consensus/history.db"

# Define your AI providers here.
# Each provider needs: name, base_url, api_key, model.
# Works with any OpenAI-compatible API (OpenAI, Anthropic via proxy, 
# OpenRouter, local models, etc.)

[[providers]]
name = "provider-1"
base_url = "https://api.openai.com/v1"
api_key = "sk-your-api-key-here"
model = "gpt-4o"
label = "🔵 GPT-4o"

[[providers]]
name = "provider-2"
base_url = "https://api.anthropic.com/v1"
api_key = "sk-ant-your-api-key-here"
model = "claude-sonnet-4-20250514"
label = "🟢 Claude Sonnet"

[[providers]]
name = "provider-3"
base_url = "https://api.openrouter.ai/v1"
api_key = "sk-or-your-api-key-here"
model = "deepseek/deepseek-chat"
label = "🟣 DeepSeek"
